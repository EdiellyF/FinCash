name: GCP

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE: fincash-backend
  REGION: us-central1
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/fincash-backend:latest
  DB_INSTANCE: ${{ secrets.GCP_INSTANCE_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hw-prod
    
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Setup Cloud SDK & Docker
        uses: google-github-actions/setup-gcloud@v1
      
      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Download Cloud SQL Auth Proxy v2
        run: |
          curl -o cloud-sql-proxy -L https://github.com/GoogleCloudPlatform/cloud-sql-proxy/releases/download/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
        
      - name: Start the Cloud SQL proxy and run migrations
        working-directory: ./backend
        run: |
          ../cloud-sql-proxy $DB_INSTANCE &
          sleep 3
          npx prisma migrate deploy

      - name: Build Docker image
        working-directory: ./backend
        run: docker build -t $IMAGE_NAME .

      - name: Push Docker image
        run: docker push $IMAGE_NAME

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE_NAME }} \
            --region ${{ env.REGION }} \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 1 \
            --platform managed \
            --port 5000 \
            --add-cloudsql-instances ${{ env.DB_INSTANCE }} \
            --allow-unauthenticated \
            --timeout=300s

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
